[ids]
*

[main]
# CapsLock을 누르고 있는 동안 'caps_nav' 레이어를 활성화
capslock = layer(caps_nav)
rightalt = C-space
[caps_nav]
# ★ 추가: CapsLock + v를 누르면 caps_locked 레이어로 전환 및 고정
v = toggle(caps_locked)

# 방향키 (j, k, l, i)
j = left
k = down
l = right
i = up

# 단어 간 건너뛰기 (q, w)
q = C-left
w = C-right

# Home / End (a, s)
a = home
s = end

# Page Up / Page Down (e, c)
e = pageup
c = pagedown

# 볼륨 제어 ([, ], \)
[ = volumedown
] = volumeup
\ = mute

# 밝기 조절
- = brightnessdown
= = brightnessup

# 한영 전환
# fxitx기준으로 - 설정 - 전역옵션 - 입력기 활성화(한글), 입력기 비활성화(영어) 단축키를 지정해줘야함. 
## 참고로 기존 지정되어있는건 지워줘야함
## 사용하지 않는 Ctrl+Shift+F12이렇게 지정했음. 
space = C-S-f12
enter = C-S-f11

# esc + f15(영어) 입력을 한다.
# macro라는게 esc + 컨트롤+쉬프트+f12 를 같이 입력해준는 것임
#f = macro(esc C-S-f12)
f = esc

# 디버깅 설정
1 = f9
2 = f10
3 = f11
4 = f12
5 = f5
6 = f6

# 격자 마우스 (내가 설치한 프로그램) : M(Super) + S(Shift) + g
tab = M-S-g

# CapsLock 상태에서 'd'를 누르면 또 다른 'caps_d_layer' 레이어로 진입 (3키 조합용)
d = layer(caps_d_layer)

[caps_d_layer]
# CapsLock + d + j/l (삭제 기능)
j = backspace
l = delete


# ==========================================
# ★ 추가: CapsLock(v)가 눌려져 고정된 상태의 레이어
# ==========================================
[caps_locked]
# esc를 누르면 고정 상태 해제 (모든 레이어 활성화 해제)
esc = clear()
# (선택 사항) 다시 v를 눌러도 해제되게 하려면 아래 주석 해제
v = toggle(caps_locked)

# 아래는 caps_nav와 동일한 기능을 수행하도록 복사된 설정입니다.
h = left
j = down
l = right
k = up

q = C-left
w = C-right

a = home
s = end

e = pageup
c = pagedown

[ = volumedown
] = volumeup
\ = mute

- = brightnessdown
= = brightnessup

space = f15
#enter = f14

1 = f9
2 = f10
3 = f11
4 = f12
5 = f5
6 = f6
#` = macro(control+k i)
# 디버깅용
grave = macro(C-k C-i)
#grave = C-k-i
f = esc
capslock = clear()

# 고정 모드에서도 d를 누르면 삭제 조합키를 사용할 수 있도록 연동
d = layer(caps_d_layer)

[alt]
esc = rightcontrol
